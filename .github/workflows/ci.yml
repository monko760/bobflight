name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firmware-host:
    strategy:
      matrix:
        board: [dummy, kakute_f7_hdv, tmotor_f7_v2]
    name: Firmware — host build + tests (${{ matrix.board }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bobflight-firmware
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DBOBFLIGHT_BOARD=${{ matrix.board }}
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  firmware-kakute:
    name: Firmware — Kakute F7 HDV cross build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bobflight-firmware
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Configure
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/stm32f745.cmake -DBOBFLIGHT_BOARD=kakute_f7_hdv -DBOBFLIGHT_HOST_SMOKE=OFF
      - name: Build
        run: cmake --build build -j
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bobflight-kakute-f7-hdv
          path: |
            bobflight-firmware/build/bobflight.elf
            bobflight-firmware/build/bobflight.hex
            bobflight-firmware/build/bobflight.bin

  configurator:
    name: Configurator — typecheck, smoke, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bobflight-configurator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Target registry catalog and UI
        run: |
          npm run targets:check
          npm --prefix ui run test:targets
      - name: Typecheck
        run: npm run typecheck
      - name: USB bench blackbox recorder
        run: node ui/scripts/test-blackbox.cjs
      - name: Onboard Blackbox status api 1/2 parser
        run: node ui/scripts/test-onboard.cjs
      - name: Onboard Blackbox protocol and api 2 SD mocks
        run: npm --prefix protocol run test:blackbox
      - name: SD probe/read allowlists (protocol client and UI CLI input)
        run: |
          npm --prefix protocol run test:sd
          npm --prefix ui run test:sd
      - name: SD download protocol layer (sd read helper on the CommandGate, CRC-32, FAT32 root reader, FW SD mock)
        run: npm --prefix protocol run test:sd-download
      - name: Blackbox tab SD download render test (list, download, CRC retry, verbatim FW errors, cancel/disconnect/tab leave, counters)
        run: npm --prefix ui run test:blackbox-download
      - name: Protocol smoke
        run: npm --prefix protocol run smoke
      - name: DFU flash model test
        run: npm --prefix protocol run test:dfu
      - name: Settings smoke
        run: npm --prefix protocol run smoke:settings
      - name: Motor protocol tests
        run: npm --prefix protocol run test:motors
      - name: Ports and Modes numeric AUX tests
        run: npm --prefix protocol run test:ports-modes
      - name: Firmware to configurator Ports and Modes contract
        run: |
          cmake -S ../bobflight-firmware -B ../bobflight-firmware/build-contract -DBOBFLIGHT_BOARD=kakute_f7_hdv
          cmake --build ../bobflight-firmware/build-contract --target bobflight_host bobflight_pid_mpu_freshness_test bobflight_blackbox_throughput_test -j 4
          node ../.github/scripts/ports-modes-contract.cjs
      - name: Firmware to configurator persistent storage and exports
        run: node ../.github/scripts/storage-contract.cjs
      - name: Actual firmware PID diagnostic framing and config isolation
        run: node ../.github/scripts/pid-diagnostics-contract.cjs
      - name: Firmware to configurator Blackbox status api 2 (SD throughput model)
        run: node ../.github/scripts/blackbox-status-contract.cjs
      - name: Firmware F2 missed-slot readouts with the shipped (origin/main) Configurator parser
        run: node ../.github/scripts/blackbox-missed-contract.cjs
      - name: Firmware status loop keys and loop_rate_hz setting to Setup loop-rate contract
        run: |
          cmake -S ../bobflight-firmware -B ../bobflight-firmware/build-contract-tmotor -DBOBFLIGHT_BOARD=tmotor_f7_v2
          cmake --build ../bobflight-firmware/build-contract-tmotor --target bobflight_host -j 4
          node ../.github/scripts/loop-status-contract.cjs
      - name: Firmware gyro notch CLI (schema 8) to Filters tab notch contract
        run: node ../.github/scripts/gyro-notch-contract.cjs
      - name: Firmware status gyro_health / gyro_sat_count to Setup gyro sanity cards contract
        run: node ../.github/scripts/gyro-status-contract.cjs
      - name: Arm gate fail-closed on real firmware status (failsafe ACTIVE / gyro_ok no)
        run: node ui/scripts/test-arm-gate-real-status.cjs ../bobflight-firmware/build-contract/bobflight_host ../bobflight-firmware/build-contract-tmotor/bobflight_host
      - name: Firmware RPM filter CLI (schema 9 keys, storage schema 10) to Filters tab RPM contract
        run: node ../.github/scripts/rpm-filter-contract.cjs
      - name: Firmware motor_direction CLI (schema 10) to Motors tab contract (Kakute + T-Motor host builds)
        run: |
          node ../.github/scripts/motor-direction-contract.cjs
          node ../.github/scripts/motor-direction-contract.cjs ../bobflight-firmware/build-contract-tmotor/bobflight_host
      - name: Receiver protocol and UI parser tests
        run: npm --prefix ui run test:receiver
      - name: Firmware receiver report (CRSF link statistics lines) to Receiver parser contract
        run: node ui/scripts/test-receiver.cjs ../bobflight-firmware/build-contract/bobflight_host waiting
      - name: Receiver CRSF link statistics readout (mocks, verbatim tokens, ReceiverPage render) tests
        run: npm --prefix ui run test:receiver-link
      - name: Live receiver switch identification in Modes
        run: node ui/scripts/test-mode-receiver.cjs
      - name: Receiver switch bench CLI guards
        run: node ui/scripts/test-switch-bench.cjs
      - name: Motor bench UI safety tests
        run: npm --prefix ui run test:motors
      - name: Storage panel refresh guard and Motors flicker lock tests
        run: npm --prefix ui run test:storage
      - name: Setup loop-rate readout and 1k/4k/8k selector (poll, mocks, wiring) tests
        run: npm --prefix ui run test:loop-rate
      - name: Setup loop-rate poll starts after an in-flight command (SetupPage render test)
        run: npm --prefix ui run test:setup-poll
      - name: Setup gyro sanity cards (gyro_health / gyro_sat_count verbatim, mocks, live re-read) render tests
        run: npm --prefix ui run test:gyro-health
      - name: Gyro notch parsers, write plan, SETTINGS_KEYS and five mock scenarios
        run: npm --prefix protocol run test:gyro-notch
      - name: Filters tab gyro notch controller (mocks, write plan, refused set, reload guard) tests
        run: npm --prefix ui run test:gyro-notch
      - name: Filters tab render test (FiltersPage cells per mock, Save order, refused set verbatim)
        run: npm --prefix ui run test:filters-page
      - name: RPM filter parsers, view, Q x100, SETTINGS_KEYS and mock scenarios
        run: npm --prefix protocol run test:rpm-filter
      - name: RPM filter render test (Filters section per mock, Save order, refused set verbatim, Motors tab motor_poles)
        run: npm --prefix ui run test:rpm-filter-page
      - name: motor_direction parsers, mock scenarios and schema 10 export rules
        run: npm --prefix protocol run test:motor-direction
      - name: Motor direction render test (Motors tab per mock, set -> get -> mixer, refused set verbatim, storage lock, bench test copy)
        run: npm --prefix ui run test:motor-direction
      - name: Zero-output PID diagnostic CLI and framing tests
        run: npm --prefix protocol run test:pid-diagnostics
      - name: Timing protocol tests
        run: npm --prefix protocol run test:timing
      - name: Loop-rate status parser, loop_rate_hz setting parsers, view models and mock tests
        run: npm --prefix protocol run test:loop-rate
      - name: Sensor protocol tests
        run: npm --prefix protocol run test:sensors
      - name: Sensor UI safety tests
        run: npm --prefix ui run test:sensors
      - name: Flight modes protocol and Modes tab safety
        run: npm --prefix protocol run test:flight-modes
      - name: Bootloader CLI parser, confirmation and transport
        run: npm --prefix protocol run test:bootloader
      - name: WebSerial smoke
        run: npm --prefix protocol run smoke:webserial
      - name: Flasher smoke
        run: npm --prefix protocol run smoke:flasher
      - name: Build
        run: npm run build

  target-tooling-windows:
    name: Target selection and PowerShell guards
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse and exercise target selection without hardware
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'build-target.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          & ./build-target.ps1 -ListTargets
          & ./build-target.ps1 -Target tmotor_f7_v2 -ValidateOnly
          foreach ($target in @('dummy', 'does_not_exist')) {
            $rejected = $false
            try { & ./build-target.ps1 -Target $target -ValidateOnly }
            catch {
              if ($_.Exception.Message -notmatch 'Target selection rejected') { throw }
              $rejected = $true
            }
            if (!$rejected) { throw "Unsafe target accepted: $target" }
          }
          $global:LASTEXITCODE = 0

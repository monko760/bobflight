# SPDX-License-Identifier: Apache-2.0
# Matek F722-PX (STM32F722RE 512KiB). Migrated verbatim from
# boards/matek-ir/matek_f722_px.yaml and the UART table in src/board/ir_load.c (main 5bea523).
# Reference config: https://raw.githubusercontent.com/betaflight/config/e1d87e7ecf6717bd3806a08400aeb892cd1d1fc3/configs/MTKS/MATEKF722HD/config.h
# Manufacturer page: https://www.mateksys.com/?portfolio=f722-px
# Pin facts only; independently authored IR. Not bench-verified on physical board.
# HSE 8 MHz supported STM32F7X2 reference default; explicitly not measured.
# Excluded UARTs: UART5 (driver missing) and UART6 (onboard Frsky Pixel OSD).
# External NOR: read-only JEDEC/status probe only. PC3 is MOSI; PB15 is camera control.
# Onboard BMP280: capability declaration, not physical detection or flight qualification.
schema_version: 1
board_id: matek_f722_px
display_name: Matek F722-PX
manufacturer: Matek
status: bf-derived
support: development
capabilities: {motor_output: true, usb_cdc: true, sd_logging: false}
configurator:
  image_profile: main
  build_label: "Matek F722-PX sensor/CRSF bring-up with settings storage; no motor output, OSD or onboard blackbox logging."
mcu:
  target: stm32f722
  part: STM32F722
  hse_mhz: 8
  flash_kib: 512             # checked at boot (ir_load.c FLASHSIZE == 512)
  linker_script: cmake/stm32f722_config.ld
usb:
  cdc: true
  dm: absent
  dp: absent
gyro:
  chip: MPU6000
  spi_bus: 1
  cs: PB2
  exti: PC4
  sck: PA5
  miso: PA6
  mosi: PA7
  orientation: CW180_DEG_FLIP
baro:
  chip: BMP280
  i2c_bus: 1
  scl: PB8
  sda: PB9
nor_flash:
  spi_bus: 2
  cs: PB12
  sck: PB13
  miso: PB14
  mosi: PC3
sd: absent
adc: {vbat: PC2, current: PC1}
motors:
  - {index: 1, pin: PC8, timer: TIM8, channel: 3, dma: absent}
  - {index: 2, pin: PC9, timer: TIM8, channel: 4, dma: absent}
  - {index: 3, pin: PB4, timer: TIM3, channel: 1, dma: absent}
  - {index: 4, pin: PB5, timer: TIM3, channel: 2, dma: absent}
led: {led0: PA14}
beeper: absent
uarts:
  - {uart: 1, tx: PA9, rx: PA10}
  - {uart: 2, tx: PA2, rx: PA3}
  - {uart: 3, tx: PC10, rx: PC11}
  - {uart: 4, tx: PA0, rx: PA1}
receiver: {uart: 2, tx: PA2, rx: PA3, protocol: CRSF}

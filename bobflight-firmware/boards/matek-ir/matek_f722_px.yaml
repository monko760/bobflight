# Board facts: Matek F722-PX (STM32F722RE 512KiB)
# Reference config: https://raw.githubusercontent.com/betaflight/config/e1d87e7ecf6717bd3806a08400aeb892cd1d1fc3/configs/MTKS/MATEKF722HD/config.h
# Manufacturer page: https://www.mateksys.com/?portfolio=f722-px
# Pin facts only; independently authored IR. Not bench-verified on physical board.
# STM32F722 sensor-only target (no motor output enabled, no SD card slot).
# HSE 8 MHz supported STM32F7X2 reference default; explicitly not measured.
# Gyro: MPU6000 on SPI1 (PA5/6/7, CS PB2, DRDY/EXTI PC4). Reference CW180_DEG_FLIP.
# Serial RX default: CRSF on UART2 (TX PA2, RX PA3).
# Selectable UARTs: UART1 (PA9/PA10), UART2 (PA2/PA3), UART3 (PC10/PC11), UART4 (PA0/PA1).
# Excluded: UART5 (driver missing) and UART6 (onboard Frsky Pixel OSD).
board_id: matek_f722_px
status: bf-derived
family: STM32F722
hse_mhz: 8
led0_pin: PA14
vbat_pin: PC2
current_pin: PC1
chip: MPU6000
spi_bus: 1
cs_pin: PB2
exti_pin: PC4
sck_pin: PA5
miso_pin: PA6
mosi_pin: PA7
gyro_align: CW180_DEG_FLIP
motors:
  - {index: 1, pin: PC8, timer: TIM8, channel: 3}
  - {index: 2, pin: PC9, timer: TIM8, channel: 4}
  - {index: 3, pin: PB4, timer: TIM3, channel: 1}
  - {index: 4, pin: PB5, timer: TIM3, channel: 2}
serial_rx:
  uart: 2
  pins: {tx: PA2, rx: PA3}
  protocol_default: CRSF

# SPDX-License-Identifier: Apache-2.0
# T-Motor F7 V2 (TMOTORF7V2 / STM32F722RE) sensor bring-up target; NOT TMOTORF7 or TMVELOXF7.
# Migrated verbatim from boards/tmotor-ir/tmotor_f7_v2.yaml (main 5bea523).
# Resource pins matched user Betaflight 4.4.0 TMOTORF7V2 readback on 2026-09-13.
# Factual wiring reference (no upstream implementation copied):
# https://github.com/betaflight/unified-targets/blob/7f1abbf7844d3299ecf2ed4cca4680dc95a941b5/configs/default/TMTR-TMOTORF7V2.config
# Multiple IMU revisions exist; this image expects MPU6000-class hardware.
# HSE 8 MHz is the STM32F7X2 target default, not a crystal measurement.
# Motors are listed as IR facts only; this target advertises no motor output.
schema_version: 1
board_id: tmotor_f7_v2
display_name: T-Motor F7 V2
manufacturer: T-Motor
status: bf-derived
support: sensor-only
capabilities: {motor_output: false, usb_cdc: true, sd_logging: false}
configurator:
  image_profile: main
  build_label: "T-Motor F7 V2 sensor-only firmware; no motor output."
mcu:
  target: stm32f722
  part: STM32F722
  hse_mhz: 8
  flash_kib: 512             # checked at boot (ir_load.c FLASHSIZE == 512)
  linker_script: cmake/stm32f722.ld
usb:
  cdc: true
  dm: absent
  dp: absent
gyro:
  chip: MPU6000
  spi_bus: 1
  cs: PA4
  exti: PC4
  sck: PA5
  miso: PA6
  mosi: PA7
  orientation: CW0_DEG
baro: absent
nor_flash: absent
sd: absent
adc: {vbat: PC2, current: PC3}
motors:
  - {index: 1, pin: PB0, timer: TIM3, channel: 3, dma: absent}
  - {index: 2, pin: PB1, timer: TIM3, channel: 4, dma: absent}
  - {index: 3, pin: PB4, timer: TIM3, channel: 1, dma: absent}
  - {index: 4, pin: PB5, timer: TIM3, channel: 2, dma: absent}
led: {led0: PC14}
beeper: absent
uarts: []                    # receiver UART is fixed; no runtime selection on this target
receiver: {uart: 2, tx: PA2, rx: PA3, protocol: CRSF}
